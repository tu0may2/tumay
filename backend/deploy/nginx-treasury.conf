# Nginx перед терминалом: сам Python слушает только 127.0.0.1, наружу
# смотрит только этот прокси. Так проще потом навесить HTTPS через certbot —
# он умеет переписывать именно такой конфиг сам.
#
# Поставьте файл в /etc/nginx/sites-available/treasury, включите:
#   sudo ln -s /etc/nginx/sites-available/treasury /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ВАШ_АДРЕС — домен (если есть) или публичный IP ВМ. Замените перед запуском.
#
# ВАЖНО про HTTPS. Пока терминал работает по http, пароль уходит по сети
# открытым текстом: его видит любой узел на пути и любой сосед по Wi-Fi.
# Пароль на голом http защищает только от случайного прохожего. Если
# терминалом пользуется не один человек, получите сертификат:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d ваш-домен.ru
# Для этого нужен домен: на голый IP сертификат не выдают.

# Ограничение частоты обращений к форме входа: без него пароль подбирается
# перебором. Приложение считает попытки само, это второй рубеж — он
# срабатывает раньше и дешевле, ещё до Python.
limit_req_zone $binary_remote_addr zone=treasury_login:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ВАШ_АДРЕС;

    client_max_body_size 15m;  # для загрузки отчётов брокера

    # Версию nginx в заголовках и на страницах ошибок не показываем:
    # она подсказывает, какие уязвимости пробовать
    server_tokens off;

    location /api/auth/login {
        # burst — небольшой запас на опечатки, nodelay — чтобы обычный
        # человек не ждал искусственной паузы
        limit_req zone=treasury_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
