# Nginx перед терминалом: сам Python слушает только 127.0.0.1, наружу
# смотрит только этот прокси. Так проще потом навесить HTTPS через certbot —
# он умеет переписывать именно такой конфиг сам.
#
# Поставьте файл в /etc/nginx/sites-available/treasury, включите:
#   sudo ln -s /etc/nginx/sites-available/treasury /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ВАШ_АДРЕС — домен (если есть) или публичный IP ВМ. Замените перед запуском.

server {
    listen 80;
    listen [::]:80;
    server_name ВАШ_АДРЕС;

    client_max_body_size 15m;  # для загрузки отчётов брокера

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
