# Nginx перед терминалом: сам Python слушает только 127.0.0.1, наружу
# смотрит только этот прокси.
#
# Поставьте файл в /etc/nginx/sites-available/treasury, включите:
#   sudo ln -s /etc/nginx/sites-available/treasury /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ВАШ_ДОМЕН — доменное имя терминала. Замените во всех трёх местах.
#
# Сертификат получается так (нужен домен, на голый IP его не выдают):
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d ваш-домен.ru
# Certbot умеет дописать блок HTTPS сам; этот файл уже содержит его целиком,
# поэтому при готовых сертификатах правки не нужны — только подставить домен.
#
# ВНИМАНИЕ, если вы правили конфиг на сервере руками или через certbot:
# скрипт обновления (deploy/update-from-git.sh) конфиги nginx НЕ трогает,
# ваш рабочий файл этот не перезапишет. Переносить изменения сюда нужно
# самим — иначе следующая установка терминала поедет со старыми правилами.

# Ограничение частоты обращений к форме входа: без него пароль подбирается
# перебором. Приложение считает попытки само, это второй рубеж — он
# срабатывает раньше и дешевле, ещё до Python.
limit_req_zone $binary_remote_addr zone=treasury_login:10m rate=12r/m;

# ----------------------------------------------------------------------
# HTTP: только увести на HTTPS
# ----------------------------------------------------------------------
# Оставлять терминал доступным по http нельзя: пароль и токен сессии уходят
# по сети открытым текстом, и их видит любой узел на пути. Поэтому на 80-м
# порту не проксируем ничего, кроме проверки сертификата.
server {
    listen 80;
    listen [::]:80;
    server_name ВАШ_ДОМЕН;
    server_tokens off;

    # Certbot подтверждает владение доменом через этот путь — его
    # перенаправлять нельзя, иначе продление сертификата перестанет работать
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# HTTPS: сам терминал
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ВАШ_ДОМЕН;

    ssl_certificate     /etc/letsencrypt/live/ВАШ_ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ВАШ_ДОМЕН/privkey.pem;

    # Только те версии протокола, в которых нет известных дыр
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 15m;  # для загрузки отчётов брокера

    # Версию nginx в заголовках и на страницах ошибок не показываем:
    # она подсказывает, какие уязвимости пробовать
    server_tokens off;

    # Заголовки безопасности приложение ставит само — здесь они не
    # дублируются, чтобы не разойтись с ним при правках. HSTS тоже: терминал
    # выставляет его, увидев X-Forwarded-Proto: https.

    location /api/auth/login {
        # burst — небольшой запас на опечатки, nodelay — чтобы обычный
        # человек не ждал искусственной паузы
        limit_req zone=treasury_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Именно $remote_addr, а не $proxy_add_x_forwarded_for: последний
        # ДОПИСЫВАЕТ адрес к тому, что прислал клиент, и первым элементом
        # списка остаётся присланное снаружи значение. Терминал считает по
        # нему попытки входа — с дописыванием счётчик обходился подстановкой
        # нового вымышленного адреса на каждой попытке.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # По этому заголовку терминал понимает, что снаружи HTTPS: он
        # выставляет HSTS и собирает собственные перенаправления с https://.
        # Чтобы приложение его читало, uvicorn запускается с --proxy-headers
        # (см. deploy/treasury.service)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
